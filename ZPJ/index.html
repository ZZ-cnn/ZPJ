<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>马卡龙糖果消消乐</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 首页 -->
    <div id="home-screen" class="screen active">
        <div class="home-bg">
            <div class="floating-macarons">
                <div class="macaron-float m1">🍬</div>
                <div class="macaron-float m2">🍭</div>
                <div class="macaron-float m3">🧁</div>
                <div class="macaron-float m4">🍪</div>
                <div class="macaron-float m5">🍩</div>
            </div>
            <div class="home-content">
                <div class="logo-container">
                    <h1 class="game-title">马卡龙糖果</h1>
                    <p class="game-subtitle">Macaron Match</p>
                </div>
                <div class="home-buttons">
                    <button class="btn btn-primary" onclick="game.showLevelSelect()">
                        <span class="btn-icon">▶</span>
                        开始游戏
                    </button>
                    <button class="btn btn-secondary" onclick="game.showSettings()">
                        <span class="btn-icon">⚙</span>
                        设置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 关卡选择页 -->
    <div id="level-screen" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="game.showHome()">←</button>
            <h2>选择关卡</h2>
            <div class="header-icons">
                <span class="heart-icon">❤</span>
                <span id="level-hearts">5</span>
            </div>
        </div>
        <div class="level-map">
            <div class="level-path">
                <!-- 关卡节点由JS生成 -->
            </div>
        </div>
    </div>

    <!-- 游戏界面 -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <button class="btn-back" onclick="game.showLevelSelect()">←</button>
            <div class="level-info">
                <span class="level-num">第 <span id="current-level">1</span> 关</span>
            </div>
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-icon">👣</span>
                    <span id="moves-count">20</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">⭐</span>
                    <span id="score-count">0</span>
                </div>
            </div>
        </div>
        
        <div class="game-target">
            <div class="target-label">目标:</div>
            <div class="target-items" id="target-items">
                <!-- 目标由JS生成 -->
            </div>
        </div>

        <div class="game-board-container">
            <div class="game-board" id="game-board">
                <!-- 棋盘由JS生成 -->
            </div>
        </div>

        <div class="power-ups">
            <button class="power-up" data-type="bomb" onclick="game.selectPowerUp('bomb')">
                <span class="power-icon">💣</span>
                <span class="power-count" id="bomb-count">3</span>
            </button>
            <button class="power-up" data-type="hammer" onclick="game.selectPowerUp('hammer')">
                <span class="power-icon">🔨</span>
                <span class="power-count" id="hammer-count">3</span>
            </button>
            <button class="power-up" data-type="rainbow" onclick="game.selectPowerUp('rainbow')">
                <span class="power-icon">🌈</span>
                <span class="power-count" id="rainbow-count">2</span>
            </button>
        </div>

        <button class="btn-pause" onclick="game.showPause()">⏸</button>
    </div>

    <!-- 结算页 -->
    <div id="result-screen" class="screen">
        <div class="result-bg">
            <div class="result-content">
                <div class="result-icon" id="result-icon">🏆</div>
                <h2 class="result-title" id="result-title">关卡完成!</h2>
                <div class="stars-container" id="stars-container">
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                </div>
                <div class="result-stats">
                    <div class="result-stat">
                        <span>得分</span>
                        <span id="final-score">0</span>
                    </div>
                    <div class="result-stat">
                        <span>剩余步数</span>
                        <span id="final-moves">0</span>
                    </div>
                </div>
                <div class="result-buttons">
                    <button class="btn btn-primary" onclick="game.nextLevel()" id="btn-next">
                        下一关
                    </button>
                    <button class="btn btn-secondary" onclick="game.replayLevel()">
                        重玩
                    </button>
                    <button class="btn btn-secondary" onclick="game.showLevelSelect()">
                        关卡选择
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置页 -->
    <div id="settings-screen" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="game.showHome()">←</button>
            <h2>设置</h2>
        </div>
        <div class="settings-content">
            <div class="setting-item">
                <span class="setting-label">音乐</span>
                <label class="switch">
                    <input type="checkbox" id="music-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span class="setting-label">音效</span>
                <label class="switch">
                    <input type="checkbox" id="sound-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span class="setting-label">振动</span>
                <label class="switch">
                    <input type="checkbox" id="vibrate-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span class="setting-label">音量</span>
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
            </div>
        </div>
    </div>

    <!-- 暂停弹窗 -->
    <div id="pause-modal" class="modal">
        <div class="modal-content">
            <h3>游戏暂停</h3>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="game.resumeGame()">继续游戏</button>
                <button class="btn btn-secondary" onclick="game.replayLevel()">重新开始</button>
                <button class="btn btn-secondary" onclick="game.showLevelSelect()">退出</button>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
